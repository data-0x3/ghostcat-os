#
# GhostCat OS — pacman.conf (build-time)
# developed by 0x3
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 10

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Dépôt BlackArch — fournit metasploit, responder, bettercap, etc.
# IMPORTANT : sur la machine de build, installe d'abord la clé :
#   curl -O https://blackarch.org/strap.sh && chmod +x strap.sh && sudo ./strap.sh
# sinon mets SigLevel = Never ci-dessous (moins sûr).
[blackarch]
SigLevel = Required DatabaseOptional
Server = https://mirror.cyberbits.eu/blackarch/$repo/os/$arch
