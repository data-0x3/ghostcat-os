# GhostCat OS — appareil anonyme sur le réseau
[connection]
# ne pas annoncer le nom de la machine au routeur (DHCP)
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# adresses IPv6 temporaires, non traçables
ipv6.ip6-privacy=2
ipv6.addr-gen-mode=stable-privacy

# pas de connexion de test vers un serveur externe
[connectivity]
enabled=false
