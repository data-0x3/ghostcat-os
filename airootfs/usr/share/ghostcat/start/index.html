<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>GhostCat</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#000;color:#f2f2f6;font:15px/1.4 "Adwaita Sans","Inter","Cantarell",system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;animation:drift 24s var(--smooth) infinite alternate}
.b1{width:44vw;height:44vw;left:-10vw;top:-14vw;background:radial-gradient(circle,#55555f,transparent 70%)}
.b2{width:36vw;height:36vw;right:-8vw;bottom:-12vw;background:radial-gradient(circle,#3a3a48,transparent 70%);animation-duration:30s}
@keyframes drift{to{transform:translate(5vw,6vh) scale(1.1)}}
main{position:relative;text-align:center;width:min(640px,90vw);animation:in 1s var(--spring) both}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(8px)}}
img{width:132px;filter:drop-shadow(0 0 28px rgba(255,255,255,.25));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.clock{font-size:64px;font-weight:700;letter-spacing:-1px;margin-top:6px}
.date{color:rgba(255,255,255,.55);margin-bottom:26px;text-transform:capitalize}
form{display:flex;align-items:center;gap:10px;height:58px;padding:0 20px;border-radius:20px;
  background:linear-gradient(140deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 20px 60px rgba(0,0,0,.5);
  transition:transform .5s var(--spring),border-color .3s}
form:focus-within{transform:scale(1.02);border-color:rgba(255,255,255,.3)}
input{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;font-size:17px}
input::placeholder{color:rgba(255,255,255,.4)}
.badges{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.badge{font-size:12px;color:rgba(255,255,255,.6);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.badge b{color:#3ddc97}
footer{position:fixed;bottom:16px;width:100%;text-align:center;font:12px "DejaVu Sans Mono",monospace;color:rgba(255,255,255,.3)}
</style></head>
<body><div class="blob b1"></div><div class="blob b2"></div>
<main>
  <img src="ghost.webp" alt="">
  <div class="clock" id="clock">--:--</div><div class="date" id="date"></div>
  <form action="https://duckduckgo.com/" method="get" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity=".6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input name="q" id="q" placeholder="Rechercher en privé avec DuckDuckGo…" autofocus>
  </form>
  <div class="badges"><span class="badge"><b>●</b> Anti-pistage strict</span><span class="badge"><b>●</b> HTTPS uniquement</span><span class="badge"><b>●</b> DNS chiffré</span><span class="badge"><b>●</b> Zéro télémétrie</span></div>
</main>
<footer>GhostCat OS · developed by 0x3</footer>
<script>
const L = navigator.language || "fr";
function tick(){ const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString(L,{hour:"2-digit",minute:"2-digit"});
  document.getElementById("date").textContent = d.toLocaleDateString(L,{weekday:"long",day:"numeric",month:"long"}); }
tick(); setInterval(tick, 1000);
if (!L.startsWith("fr")) {
  document.getElementById("q").placeholder = "Search privately with DuckDuckGo…";
  const t = ["Strict anti-tracking","HTTPS only","Encrypted DNS","Zero telemetry"];
  document.querySelectorAll(".badge").forEach((b,i) => b.lastChild.textContent = " " + t[i]);
}
</script></body></html>
